# Thea2 CI — the five gates the docs always claimed, run by a machine
# (Phase 1, 2026-09-02: before this file existed, "five CI gates green" meant
# five npm scripts somebody remembered to run).
#
# W0 (2026-09-03): the suite runs as chunks (test:a = c1a+c1b+c2, test:b = b) —
# one long vitest process wedges a worker on some runners (sync-spin, no
# timeout fires; see TESTING.md chunk doctrine). Each chunk job retries a
# wedged run (no summary = environmental; completed-but-failed = real, no
# retry). The gates job runs once; chunk jobs run in parallel after it.
#
# W1 (2026-09-03): c1a/c1b/c2 split into PARALLEL jobs — sequential test:a
# outgrew first the 30-min ceiling, then 60 (suite at 1527+ tests, serial
# forks by doctrine). Wall time is now the slowest chunk, not their sum.
name: ci
on:
  push:
  pull_request:
# A push superseded by a newer one stops paying for its own run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run gates
  test-c1a:
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: c1a (affect + app, retry on environmental wedge)
        run: |
          for i in 1 2 3; do
            npx vitest run test/affect test/app > /tmp/chunk.log 2>&1 && exit 0
            if grep -qE "Test Files" /tmp/chunk.log; then
              echo "completed but failed - real failure, no retry"
              tail -40 /tmp/chunk.log
              exit 1
            fi
            echo "attempt $i: no summary (environmental wedge) - retrying"
          done
          echo "all attempts wedged"
          exit 1
  test-c1b:
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: c1b (assemble, retry on environmental wedge)
        run: |
          for i in 1 2 3; do
            npx vitest run test/assemble > /tmp/chunk.log 2>&1 && exit 0
            if grep -qE "Test Files" /tmp/chunk.log; then
              echo "completed but failed - real failure, no retry"
              tail -40 /tmp/chunk.log
              exit 1
            fi
            echo "attempt $i: no summary (environmental wedge) - retrying"
          done
          echo "all attempts wedged"
          exit 1
  test-c2:
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: c2 (bridge..kernel, retry on environmental wedge)
        run: |
          for i in 1 2 3; do
            npx vitest run test/bridge test/consolidate test/coupling test/corpus test/derive test/embed test/events test/inhibit test/kernel > /tmp/chunk.log 2>&1 && exit 0
            if grep -qE "Test Files" /tmp/chunk.log; then
              echo "completed but failed - real failure, no retry"
              tail -40 /tmp/chunk.log
              exit 1
            fi
            echo "attempt $i: no summary (environmental wedge) - retrying"
          done
          echo "all attempts wedged"
          exit 1
  test-b:
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: test:b (chunk b)
        run: npm run test:b
      # ADR-007: the committed derived corpus must match its manifest. Advisory
      # until corpus/derived is tracked with a manifest (review 2026-09-02).
      - run: npm run corpus:check
        continue-on-error: true
