# Thea2 CI — the five gates the docs always claimed, run by a machine
# (Phase 1, 2026-09-02: before this file existed, "five CI gates green" meant
# five npm scripts somebody remembered to run).
name: ci
on:
  push:
  pull_request:
# A push superseded by a newer one stops paying for its own run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    # The suite is hermetic and takes minutes, not hours; 45 is hang detection,
    # not headroom for slowness.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run gates
      - run: npm test
      # ADR-007: the committed derived corpus must match its manifest. Advisory
      # until corpus/derived is tracked with a manifest (review 2026-09-02).
      - run: npm run corpus:check
        continue-on-error: true
