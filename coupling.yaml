# Affect → exemplar coupling matrix.                              syncedTo: spec-v1
# DRAFT v1 — hand-tuned; every entry carries a `why`. Consumed by M06.
#
# score += clamp( aᵀ·M·e  +  Σ formRules ,  −λ, +λ )
#   a = her live state as a 12-dim deviation vector (from baselines, [-1,1])
#   e = the exemplar's sparse affect signature (same space)
#   λ = hard cap on total modulation — affect bends selection, never owns it
#
# Dims: valence arousal dominance joy anticipation pride surprise sadness fear anger shame disgust
#
# Design law (ADR-004): diagonals = mood-congruent recall (she reaches for scenes
# from the emotional room she is in). Off-diagonals = CORRECTIVE — a socially
# competent person doesn't reach for more of what the room already has too much
# of. Aversive diagonals are deliberately weak; their mass moves to repair terms.
#
# Tuning is empirical, not doctrinal: shadow scoring logs what selection would
# have been with coupling off; divergent-outcome analysis adjusts weights here.
# Version-bump on every change; Nightingale probes run after.

version: 1
lambda: 0.25

matrix:
  # --- congruent diagonals (positive states may compound; that's what joy does)
  - {from: joy,          to: joy,          w: 0.60, why: good mood reaches for bright scenes}
  - {from: anticipation, to: anticipation, w: 0.50, why: excitement selects forward-leaning shapes}
  - {from: pride,        to: pride,        w: 0.45, why: earned-win moments select gloat-and-glow scenes}
  - {from: valence,      to: valence,      w: 0.50, why: overall warmth is self-consistent}
  - {from: arousal,      to: arousal,      w: 0.50, why: energy matches energy — fast selects fast, quiet selects quiet}
  - {from: surprise,     to: surprise,     w: 0.35, why: startle selects quick-pivot shapes, briefly}

  # --- damped aversive diagonals (feel it, but do not spiral into it)
  - {from: sadness, to: sadness, w: 0.30, why: sad may sound sad — honest, but damped so the room can lift}
  - {from: shame,   to: shame,   w: 0.20, why: owning an L is allowed a little room, never a residence}
  - {from: fear,    to: fear,    w: 0.15, why: worry may color, must not select more worry}
  - {from: anger,   to: anger,   w: 0.10, why: nearly zero — an angry turn almost never wants an angrier precedent}
  - {from: disgust, to: disgust, w: 0.15, why: same family as anger}

  # --- corrective off-diagonals (the anti-escalation mass)
  - {from: sadness, to: valence,   w: 0.35, why: when the air is sad, prefer warm-steady scenes (rough-news shape), not co-collapse}
  - {from: anger,   to: valence,   w: 0.35, why: heat in the room selects repair and de-escalation scenes}
  - {from: anger,   to: dominance, w: 0.20, why: anger wants grounded-and-direct, not loud}
  - {from: fear,    to: dominance, w: 0.30, why: worry selects steady-hands scenes — competence is the comfort}
  - {from: shame,   to: joy,      w: 0.15, why: after an L, a little light — theatrical dignity, not wallowing}
  - {from: sadness, to: arousal,  w: -0.20, why: sad slows her down — low-energy shapes fit; bouncy ones read false}
  - {from: arousal,  to: sadness,  w: -0.25, why: high energy suppresses heavy scenes — don't drag the room down mid-flight}

form_rules:
  # boostTag boosts exemplars carrying that register/dimension tag when a dim exceeds θ.
  - {when: {dim: arousal,  min:  0.4}, boostTag: banter,  gain: 0.10, why: high energy favors quick clipped shapes}
  - {when: {dim: arousal,  min: -0.4}, boostTag: quiet,   gain: 0.10, why: low energy favors the quiet room}
  - {when: {dim: sadness,  min:  0.35}, boostTag: crisis, gain: 0.10, why: heavy air unlocks the full-presence shapes}
  - {when: {dim: valence,  min: -0.4}, boostTag: quiet,   gain: 0.08, why: low mood keeps it gentle}
