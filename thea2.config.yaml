# Thea2 production config. Secrets NEVER live here (AGENTS rule 7) —
# THEA2_BOT_TOKEN and THEA2_MODEL_API_KEY arrive via /etc/thea2/keys.env.
# loadConfig rejects any secret-shaped value in this file at startup.
#
# sync'd with src/app/config.ts schema (M20). Unknown keys are rejected.
models:
  # Z.ai GLM — Diego's pinned backend, re-confirmed 2026-09-02 ("I WANT TO USE
  # Z-AI GLM 5.3 flash! DO NOT USE NEURALWATT"). The OpenAI-compat door is
  # pay-as-you-go and 1113s on this account; the ANTHROPIC-compat door is what
  # his coding plan covers, so the wire protocol is anthropic + streaming SSE.
  endpoint: https://api.z.ai/api/anthropic
  protocol: anthropic
  tiers:
    main: glm-5.3-flash     # her voice — fast tier, Diego's explicit pick
    cheap: glm-5.3-flash    # appraisals + heartbeat thoughts (flash IS the cheap door)
    reasoning: glm-5.3      # the judge — full model; the plan covers both
# The people registry (Round 3): her [INTERLOCUTOR] line says his name, not a
# raw tg id. Keyed by the bridge's speaker person id.
people:
  "tg:6971556140":
    name: Diego
    language: es
bridge:
  # Diego's telegram chat id — the ONLY chat the bridge answers. Filled from
  # the first live getUpdates poll (2026-09-02, NEOGEO private chat).
  allowedChatIds: [6971556140]
# Diego's zone: quiet hours, the daily heartbeat cap, and the day census are
# read in THIS zone (Phase 1, 2026-09-02 — they were UTC before, which gagged
# her 04:00–11:00 Madrid and freed her at 03:00).
timezone: Europe/Madrid
affect:
  statePath: var/affect/state.json
  # [start, end) LOCAL hours; start > end wraps midnight. 01:00–09:00 Madrid.
  quietHours: [1, 9]
sched:
  statePath: var/sched/state.json
budgets:
  packetTokens: 6000
  windowTokens: 10000
  turnTokens: 24000
inhibitionPlacement: trailing
gravity:
  seedWeight: 0.7
reconcile:
  lostReplyWindowMin: 10
embedder:
  # DEVIATION (recorded in M20 "As built"): kind 'fastembed' is NOT built yet —
  # it lands at S9 and fails loud if configured now. Until then prod runs the
  # hash embedder: same identity everywhere (corpus index + episodes + queries),
  # weaker semantics. When S9 lands, switch the kind AND rebuild var/cache/corpus.
  kind: hash
  # model: BAAI/bge-small-en-v1.5   # uncomment with kind: api|fastembed at S9
