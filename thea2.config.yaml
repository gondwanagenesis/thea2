# Thea2 production config — v8 "Nothing Told" (plan thea2-v8-nothing-told.md).
# Secrets NEVER live here (AGENTS rule 7) — door keys arrive via
# /etc/thea2/keys.env under each door's keyEnv name. loadConfig rejects any
# secret-shaped value in this file at startup. Unknown keys are rejected.
#
# Doors (v8, measured 2026-09-25 from the VPS):
#   voice         OpenAI gpt-5.6-sol — the SAME brain as the original Thea, so a
#                 comparison of the two Theas compares theories, not models.
#                 /chat/completions accepts function tools on this model ONLY
#                 with reasoning_effort 'none' (400 otherwise) and rejects
#                 `max_tokens` (needs max_completion_tokens). Temperature is
#                 honored at effort none — the metabolism channel sets it per turn,
#                 so the door carries NO temperature (a door temperature outranks
#                 the request).
#   voiceFallback Neuralwatt glm-5.3 effort low (1.1 s TTFT measured), tried once
#                 when a turn fails outright on the voice door.
#   mind          Neuralwatt deepseek-v4-flash — slow appraisal, labelling.
#   judge         Neuralwatt kimi-k3 — unused by v8 today; the registry needs it.
models:
  doors:
    voice:
      endpoint: https://api.openai.com/v1
      protocol: openai
      keyEnv: THEA2_OPENAI_KEY
      model: gpt-5.6-sol
      effortLock: none
      outputCapParam: max_completion_tokens
      forcing: tool_choice
      # front of house: her voice. gpt-5.6-sol list price (2026-07-30): $5 in / $30 out.
      pricing: { inputPerM: 5, outputPerM: 30 }
    voiceFallback:
      endpoint: https://api.neuralwatt.com/v1
      protocol: openai
      keyEnv: THEA2_NEURALWATT_KEY
      model: glm-5.3
      effort: low
      forcing: tool_choice
      topP: 0.95
    # back of house (Diego 2026-09-26: "gpt for the back of house stuff, a cheap
    # model"): appraisal, her thoughts, nightly passes, casts, photo descriptions.
    # gpt-5.6-luna, $0.20 in / $1.20 out (~25x cheaper than sol). Like sol it takes
    # tools only at reasoning_effort none on /chat/completions (400 otherwise).
    mind:
      endpoint: https://api.openai.com/v1
      protocol: openai
      keyEnv: THEA2_OPENAI_KEY
      model: gpt-5.6-luna
      outputCapParam: max_completion_tokens
      pricing: { inputPerM: 0.2, outputPerM: 1.2 }
      # effortLock (v8 fork run, 2026-09-25): the client's class default
      # ('appraisal' → low) outranked `effort: none`, deepseek thought until the
      # cap and every structured call came back empty. Locked off.
      effortLock: none
      forcing: tool_choice
    judge:
      endpoint: https://api.neuralwatt.com/v1
      protocol: openai
      keyEnv: THEA2_NEURALWATT_KEY
      model: kimi-k3
      effort: none
      forcing: tool_choice
people:
  "tg:6971556140":
    name: Diego
    language: es
bridge:
  # allowedChatIds[0] is Diego's DM (the owner). v11: the second id is the
  # "House of Tiktaalik" group — she lives there too, with full owner powers for
  # Diego and chat + lookups only for everyone else (people and other bots).
  allowedChatIds: [6971556140, -1003753077911]
  # names that mean she's being addressed in the group
  selfAliases: [thea, dodonotnobot]
# Diego's zone: quiet hours, the day census, the sleep hour are read in THIS zone.
timezone: Europe/Madrid
affect:
  statePath: var/affect/state.json
  # [start, end) LOCAL hours; start > end wraps midnight. 01:00–09:00 Madrid.
  quietHours: [1, 9]
sched:
  statePath: var/sched/state.json
budgets:
  packetTokens: 6000
  windowTokens: 10000
  turnTokens: 24000
inhibitionPlacement: trailing
reconcile:
  lostReplyWindowMin: 10
embedder:
  # v8: real vectors (the v7 hash embedder made recall lexical noise).
  # Rides the voice door's endpoint + key (OpenAI).
  kind: api
  model: text-embedding-3-small
  dim: 1536
mind:
  engine: v8
  dir: var/mind
  # Idle mind budget: at most 12 private thoughts and 3 texts she starts per day.
  thoughtsPerDay: 12
  # golden rule 20: up to 8 texts she starts a day (the wait after an unanswered one doubles)
  textFirstPerDay: 8
  sleepHourLocal: 4
# v9 body (plan ~/.claude/plans/thea2-v9-parity.md): her senses and hands.
# Only env NAMES here. THEA2_TTS_VOICE is her voice (the same one Thea1's voice
# notes use), copied on-box; an absent optional key = that capability absent.
body:
  dir: var/house
  openaiKeyEnv: THEA2_OPENAI_KEY
  visionModel: gpt-5.6-luna
  transcribeModel: gpt-4o-transcribe
  listenModel: gpt-audio-1.5
  ttsModel: gpt-4o-mini-tts
  ttsVoiceEnv: THEA2_TTS_VOICE
  falKeyEnv: THEA2_FAL_KEY
  braveKeyEnv: THEA2_BRAVE_KEY
  presentKeyEnv: THEA2_PRESENT_KEY
  walletMonthUsd: 10
# v9 face: the Mini App + voice mode, served by thead on 127.0.0.1:3471 (the
# thea2-dashboard-tunnel quick tunnel is the only way in; key via env).
face:
  port: 3471
  keyEnv: THEA2_DASHBOARD_KEY
  staticDir: dashboard/static
