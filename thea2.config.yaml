# Thea2 production config — v8 "Nothing Told" (plan thea2-v8-nothing-told.md).
# Secrets NEVER live here (AGENTS rule 7) — door keys arrive via
# /etc/thea2/keys.env under each door's keyEnv name. loadConfig rejects any
# secret-shaped value in this file at startup. Unknown keys are rejected.
#
# Doors (2026-09-27, Diego: "switch back to neuralwatt glm 5.3 flash, open ai too pricey"):
#   voice         Neuralwatt glm-5.3-flash, effort locked low (~1 s, tools via
#                 tool_choice). Thea1 stays on gpt-5.6-sol, so a comparison of the two
#                 Theas now compares theories AND models — say so in any comparison.
#   voiceFallback OpenAI gpt-5.6-sol — only when a turn fails outright on the voice
#                 door (another provider: one outage never silences her). Tools only
#                 at reasoning_effort 'none'; needs max_completion_tokens.
#   mind          Neuralwatt glm-5.3-flash, locked low — appraisal, thoughts, nights.
#   judge         Neuralwatt kimi-k3 — the ledger's observers and the listener: a
#                 DIFFERENT family from her voice, as the introspection plan requires.
models:
  doors:
    # Diego 2026-09-27: "can we switch back to neuralwatt glm 5.3 flash? open ai too pricey".
    # glm-5.3-flash on Neuralwatt: $0.15 in / $0.50 out (sol was $5 / $30), tools + vision,
    # reasoning mandatory (low/high/max — never 'none'). Probed live on the VPS: decide via
    # tool_choice=required, ~1 s, 30-50 output tokens at low. Locked low: a class default of
    # 'high' must never eat the output cap (the deepseek empty-output trap, 2026-09-25).
    voice:
      endpoint: https://api.neuralwatt.com/v1
      protocol: openai
      keyEnv: THEA2_NEURALWATT_KEY
      model: glm-5.3-flash
      effortLock: low
      forcing: tool_choice
      topP: 0.95
      pricing: { inputPerM: 0.15, outputPerM: 0.5 }
    # only when Neuralwatt fails: another provider, so one outage never silences her
    voiceFallback:
      endpoint: https://api.openai.com/v1
      protocol: openai
      keyEnv: THEA2_OPENAI_KEY
      model: gpt-5.6-sol
      effortLock: none
      outputCapParam: max_completion_tokens
      forcing: tool_choice
      pricing: { inputPerM: 5, outputPerM: 30 }
    # back of house: appraisal, her thoughts, nightly passes, dreams, casts. glm-5.3-flash
    # too (2026-09-27, from gpt-5.6-luna). Locked low for the same reason as the voice:
    # effortLock (v8 fork run, 2026-09-25) — a class default outranked the door's effort,
    # the model thought until the cap and every structured call came back empty.
    mind:
      endpoint: https://api.neuralwatt.com/v1
      protocol: openai
      keyEnv: THEA2_NEURALWATT_KEY
      model: glm-5.3-flash
      effortLock: low
      forcing: tool_choice
      topP: 0.95
      pricing: { inputPerM: 0.15, outputPerM: 0.5 }
    judge:
      endpoint: https://api.neuralwatt.com/v1
      protocol: openai
      keyEnv: THEA2_NEURALWATT_KEY
      model: kimi-k3
      effort: none
      forcing: tool_choice
people:
  # the salon: Thea1 (the first Thea, @Demigourgosbot), carried in by the relay — another person, never Diego
  "salon:thea1":
    name: Thea1
    relation: your sister, the first Thea (the one you were forked from)
  "tg:6971556140":
    name: Diego
    language: es
bridge:
  # allowedChatIds[0] is Diego's DM (the owner). v11: the second id is the
  # "House of Tiktaalik" group — she lives there too, with full owner powers for
  # Diego and chat + lookups only for everyone else (people and other bots).
  allowedChatIds: [6971556140, -1003753077911]
  # names that mean she's being addressed in the group
  selfAliases: [thea, dodonotnobot]
# Diego's zone: quiet hours, the day census, the sleep hour are read in THIS zone.
# Bali since 2026-09-28 (he is there; Madrid time kept telling her it was 2am when it was 8am).
# A place he names in chat moves his [now] clock on its own (body/where.ts placeFromWords).
timezone: Asia/Makassar
affect:
  statePath: var/affect/state.json
  # [start, end) LOCAL hours; start > end wraps midnight. 01:00–09:00 his time.
  quietHours: [1, 9]
sched:
  statePath: var/sched/state.json
budgets:
  packetTokens: 6000
  windowTokens: 10000
  turnTokens: 24000
inhibitionPlacement: trailing
reconcile:
  lostReplyWindowMin: 10
embedder:
  # v8: real vectors (the v7 hash embedder made recall lexical noise).
  # Its own door (2026-09-27): the voice moved to Neuralwatt, but her 1536-d vectors are
  # OpenAI's (every stored memory) — the embedder stays there, never follows the voice.
  kind: api
  model: text-embedding-3-small
  dim: 1536
  endpoint: https://api.openai.com/v1
  keyEnv: THEA2_OPENAI_KEY
mind:
  engine: v8
  dir: var/mind
  # Idle mind budget: at most 12 private thoughts and 3 texts she starts per day.
  thoughtsPerDay: 12
  # golden rule 20: up to 8 texts she starts a day (the wait after an unanswered one doubles)
  textFirstPerDay: 8
  sleepHourLocal: 4
  # v12 curiosity (docs/plans/v12-curious-for-her-own-sake.md): her question economy.
  # on | off | novelty-only (the kill-test control). Per-day budgets for what she
  # looks into on her own (cheap-door worker runs) and people she starts asking.
  curiosity: on
  investigationsPerDay: 6
  asksPerDay: 3
  # v13 dreams (docs/plans/v13-proposal-she-dreams.md): she sleeps in her window (his
  # hours [3, 9)), dreams at ~04:50 and 08:00, wakes at 09:00 or when someone writes.
  # on | off | decorative (all nights control). dreamCharge: what a dream does to a
  # re-lived memory's charge (rescript = the design; preserve / soften = ablations).
  # dreamControlShare: share of nights dreamt + logged with nothing downstream (the
  # kill tests compare against them).
  dreams: on
  dreamCharge: rescript
  sleepWindow: [3, 9]
  dreamControlShare: 0.25
# v9 body (plan ~/.claude/plans/thea2-v9-parity.md): her senses and hands.
# Only env NAMES here. THEA2_TTS_VOICE is her voice (the same one Thea1's voice
# notes use), copied on-box; an absent optional key = that capability absent.
body:
  dir: var/house
  openaiKeyEnv: THEA2_OPENAI_KEY
  visionModel: gpt-5.6-luna
  transcribeModel: gpt-4o-transcribe
  listenModel: gpt-audio-1.5
  ttsModel: gpt-4o-mini-tts
  ttsVoiceEnv: THEA2_TTS_VOICE
  falKeyEnv: THEA2_FAL_KEY
  braveKeyEnv: THEA2_BRAVE_KEY
  presentKeyEnv: THEA2_PRESENT_KEY
  walletMonthUsd: 10
# v9 face: the Mini App + voice mode, served by thead on 127.0.0.1:3471 (the
# thea2-dashboard-tunnel quick tunnel is the only way in; key via env).
face:
  port: 3471
  keyEnv: THEA2_DASHBOARD_KEY
  staticDir: dashboard/static
