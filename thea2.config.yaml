# Thea2 production config. Secrets NEVER live here (AGENTS rule 7) —
# THEA2_BOT_TOKEN and THEA2_MODEL_API_KEY arrive via /etc/thea2/keys.env.
# loadConfig rejects any secret-shaped value in this file at startup.
#
# sync'd with src/app/config.ts schema (M20). Unknown keys are rejected.
models:
  # Neuralwatt (OpenAI-compatible) — 2026-09-02. Diego's z.ai keys are dead
  # (2x insufficient balance, 1x expired); Neuralwatt is Thea1's proven backend.
  endpoint: https://api.neuralwatt.com/v1
  tiers:
    main: glm-5.3          # her voice — the glm family Diego pinned
    cheap: deepseek-v4-flash # appraisals + heartbeat thoughts (fast, tools verified)
    reasoning: glm-5.3
bridge:
  # Diego's telegram chat id — the ONLY chat the bridge answers. Filled from
  # the first live getUpdates poll (2026-09-02, NEOGEO private chat).
  allowedChatIds: [6971556140]
affect:
  statePath: var/affect/state.json
  quietHours: [2, 9]
sched:
  statePath: var/sched/state.json
budgets:
  packetTokens: 6000
  windowTokens: 10000
  turnTokens: 24000
inhibitionPlacement: trailing
gravity:
  seedWeight: 0.7
reconcile:
  lostReplyWindowMin: 10
embedder:
  # DEVIATION (recorded in M20 "As built"): kind 'fastembed' is NOT built yet —
  # it lands at S9 and fails loud if configured now. Until then prod runs the
  # hash embedder: same identity everywhere (corpus index + episodes + queries),
  # weaker semantics. When S9 lands, switch the kind AND rebuild var/cache/corpus.
  kind: hash
  # model: BAAI/bge-small-en-v1.5   # uncomment with kind: api|fastembed at S9
