# Thea2 hermetic preset fixture — the e2e tests boot THIS config, then compose()
# redirects every var/ path under the test's tmp dir (opts.varDir wins over the
# paths below, which exist only so the file validates standalone).
# No secrets here by law (AGENTS rule 7): token + key arrive via env in the
# test harness, never this file.
models:
  endpoint: https://hermetic.invalid/v1
  tiers:
    main: mock-main
    cheap: mock-cheap
    reasoning: mock-reasoning
bridge:
  allowedChatIds: [861800000]
affect:
  statePath: var/affect/state.json
  quietHours: [1, 7]
sched:
  statePath: var/sched/state.json
budgets:
  packetTokens: 6000
  windowTokens: 10000
  turnTokens: 24000
inhibitionPlacement: trailing
gravity:
  seedWeight: 0.7
reconcile:
  lostReplyWindowMin: 10
embedder:
  kind: hash
